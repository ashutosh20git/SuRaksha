name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Node: lint / typecheck / test ──────────────────────────────────────────
  node:
    name: Node — lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test --reporter=verbose

  # ─── Python: lint / test ────────────────────────────────────────────────────
  python:
    name: Python — lint / test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - forensic-pipeline
          - ocr-pipeline
          - graph-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/verify-platform/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install ruff pytest -r services/verify-platform/${{ matrix.service }}/requirements.txt

      - name: Lint
        run: ruff check services/verify-platform/${{ matrix.service }}

      - name: Test
        run: pytest services/verify-platform/${{ matrix.service }}/tests -v

  # ─── Security: dependency audit ─────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high

      - name: Snyk — Node
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
        continue-on-error: false

      - name: Snyk — Python (forensic-pipeline)
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=services/verify-platform/forensic-pipeline/requirements.txt
        continue-on-error: false
